server:
  port: 8080
spring:
  application:
    name: "MsAutenticacion"
  devtools:
    add-properties: false
  h2:
    console:
      enabled: true
      path: "/h2"
  profiles:
    include: null
management:
  endpoints:
    web:
      exposure:
        include: "health,prometheus"
  endpoint:
    health:
      probes:
        enabled: true
cors:
  allowed-origins: "http://localhost:4200,http://localhost:8080"

routes:
  paths:
    users: "/api/v1/usuarios"
    userById: "/api/v1/usuarios/{id}"

springdoc:
  swagger-ui:
    path: /swagger-ui.html

adapters:
  r2dbc:
    host: localhost
    port: 5432
    database: authentication
    username: postgres
    password: admin123
